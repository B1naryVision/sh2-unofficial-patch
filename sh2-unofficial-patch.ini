; Stronghold 2 Unofficial Patch - configuration
;
; Place this file next to d3d9.dll in the Stronghold 2 game directory.
; The file is optional: if it (or any setting) is missing, the built-in
; default shown below is used. Lines starting with ; are comments.

[hotkeys]
; Accepted key names:
;   - a single letter or digit         H, K, 5
;   - function keys                    F1 .. F24
;   - named keys                       Space, Tab, Enter, Backspace, Insert,
;                                      Delete, Home, End, PageUp, PageDown
;   - extra mouse buttons              Mouse3 (middle), Mouse4, Mouse5
;   - a raw virtual-key code in hex    0x48
;   - None                             disables the hotkey entirely

; Stop the currently selected troops (same as the Stop button).
StopTroops=H

; Toggle the attack-move stance of the currently selected troops
; (same as the Attack button on the troop command panel).
AttackToggle=Mouse4

[camera]
; Mouse-wheel and keyboard zoom speed multiplier.
; 1.0 = stock game speed (patch inactive). Accepted range: 0.1 to 10.0.
; Values outside the range disable the patch. Example: 2.5 zooms 2.5x faster.
ZoomSpeedMultiplier=1.0
