; Stronghold 2 Unofficial Patch - configuration
;
; Place this file next to d3d9.dll in the Stronghold 2 game directory.
; The file is optional: if it (or any setting) is missing, the built-in
; default shown below is used. Lines starting with ; are comments.

[hotkeys]
; Accepted key names:
;   - a single letter or digit         H, K, 5
;   - function keys                    F1 .. F24
;   - named keys                       Space, Tab, Enter, Backspace, Insert,
;                                      Delete, Home, End, PageUp, PageDown,
;                                      Backtick (the ` / ~ key)
;   - extra mouse buttons              Mouse3 (middle), Mouse4, Mouse5
;   - a raw virtual-key code in hex    0x48
;   - None                             disables the hotkey entirely

; Stop the currently selected troops (same as the Stop button).
StopTroops=H

; Toggle the attack-move stance of the currently selected troops
; (same as the Attack button on the troop command panel).
AttackToggle=Mouse4

; Toggle the auto-market editor panel, where you set per-good Min (auto-buy)
; and Max (auto-sell) stock thresholds. Set to None to disable the whole
; auto-market feature (no overlay, no automatic trading).
AutoMarketPanel=Backtick

[camera]
; Mouse-wheel and keyboard zoom speed multiplier.
; 1.0 = stock game speed (patch inactive). Accepted range: 0.1 to 10.0.
; Values outside the range disable the patch. Example: 2.5 zooms 2.5x faster.
ZoomSpeedMultiplier=1.0

[recruitment]
; Number of units queued per click while Shift is held on a unit icon in the
; barracks, mercenary post, monastery, engineers guild or siege camp. The
; game checks gold, weapons and peasants for every unit separately, so the
; batch simply stops early when resources run out.
; 0 or 1 = vanilla single recruit (feature off).
; Accepted range: 2 to 100; any other value falls back to the default of 20.
RecruitmentShiftMultiplier=20

; ── Presets ──────────────────────────────────────────────────────────────────
; Named threshold sets loadable from the editor's preset picklist (PageUp/
; PageDown to choose a name, Enter or the Apply button to load it). Applying a
; preset is replace-all: goods not listed are cleared to 0. Each line is
;   Good = min:X, max:Y   (either part optional); good names match the editor.
; Add, edit or remove [preset:NAME] sections freely; NAME is shown in the list.

[preset:Start Game]
Apples=max:5
Bread=min:5
Meat=min:5
Cheese=min:5
