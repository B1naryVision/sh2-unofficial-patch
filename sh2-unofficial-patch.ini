; Stronghold 2 Unofficial Patch - configuration
;
; Place this file next to d3d9.dll in the Stronghold 2 game directory.
; The file is optional: if it (or any setting) is missing, the built-in
; default shown below is used. Lines starting with ; are comments.

[hotkeys]
; Accepted key names:
;   - a single letter or digit         H, K, 5
;   - function keys                    F1 .. F24
;   - numpad keys                      Numpad0 .. Numpad9, NumpadPlus,
;                                      NumpadMinus, NumpadMultiply,
;                                      NumpadDivide, NumpadDecimal
;   - named keys                       Space, Tab, Enter, Backspace, Insert,
;                                      Delete, Home, End, PageUp, PageDown,
;                                      Escape, Up, Down, Left, Right,
;                                      Backtick (the ` / ~ key), Semicolon,
;                                      Plus, Comma, Minus, Period, Slash,
;                                      LBracket, Backslash, RBracket, Quote,
;                                      CapsLock, ScrollLock, NumLock, Pause,
;                                      PrintScreen
;   - extra mouse buttons              Mouse3 (middle), Mouse4, Mouse5
;   - a raw virtual-key code in hex    0x48
;   - None                             disables the hotkey entirely
;
; Any of these can be combined with Ctrl, Shift and/or Alt, e.g.
;   StopTroops=Ctrl+Shift+H
; The combination must match exactly: with Ctrl+H bound, plain H does nothing,
; and with plain H bound it does not fire while you are holding Ctrl.

; Open the in-game settings panel, where every shortcut below can be rebound
; with the mouse and keyboard (changes are written back to this file).
; Set to None to remove the panel entirely.
SettingsPanel=Ctrl+Shift+O

; Stop the currently selected troops (same as the Stop button).
StopTroops=H

; Toggle the attack-move stance of the currently selected troops
; (same as the Attack button on the troop command panel).
AttackToggle=Mouse4

; Toggle the auto-market editor panel, where you set per-good Min (auto-buy)
; and Max (auto-sell) stock thresholds. Set to None to disable the whole
; auto-market feature (no overlay, no automatic trading).
AutoMarketPanel=Backtick

[camera]
; Mouse-wheel and keyboard zoom speed multiplier.
; 1.0 = stock game speed (patch inactive). Accepted range: 0.1 to 10.0.
; Values outside the range disable the patch. Example: 2.5 zooms 2.5x faster.
ZoomSpeedMultiplier=1.0

; Camera scroll speed multiplier, for the keyboard scroll keys and for pushing
; the mouse against a screen edge.
; 1.0 = stock game speed (patch inactive). Accepted range: 0.1 to 10.0.
; Values outside the range disable the patch. Example: 2.0 scrolls twice as
; fast. As in the stock game, scrolling stays faster the further you zoom out.
ScrollSpeedMultiplier=1.0

; How far the camera may zoom out.
; Vanilla (default) = the game's own limit, patch inactive.
; Auto = zoom out to the furthest point the view still holds up, worked out
; from the size of the map you are playing and the angle of your camera. There
; is nothing to tune: looking straight down reaches further than a tilted view,
; and the patch accounts for that as you tilt.
ZoomOutLimit=Vanilla

[interface]
; The siege camp shortcut (J) normally opens the siege camp panel and travels to
; your first siege camp in the same press. With this on, the first press only
; opens the panel and leaves your view alone; press J again while the panel is
; open to travel there - the same way the barracks (B) and granary (G)
; shortcuts already work.
; 1 = open first, travel on the second press (default). 0 = vanilla.
SiegeCampJumpOnSecondPress=1

[ui]
; Size of the patch's own panels (auto-market editor, settings panel, end-of-
; game statistics) as a percentage. They are drawn at 100 on a 1080p screen and
; scale with the game's resolution from there.
; Auto (default) = pick it from the resolution. Accepted range: 50 to 300;
; any other value falls back to Auto. A panel too large for the screen shrinks
; itself to fit whatever this is set to.
Scale=Auto

[multiplayer]
; Hide games that have already started from the multiplayer game list.
; The game will not let you join one anyway - clicking it does nothing at all -
; so they are only clutter. Games hosted by players without the patch are
; filtered out too; only your own copy needs this.
; 1 = hide them (default). 0 = vanilla, list everything (no hooks installed).
HideInProgressLobbies=1

[recruitment]
; Number of units queued per click while Shift is held on a unit icon in the
; barracks, mercenary post, monastery, engineers guild or siege camp. The
; game checks gold, weapons and peasants for every unit separately, so the
; batch simply stops early when resources run out.
; 0 or 1 = vanilla single recruit (feature off).
; Accepted range: 2 to 100; any other value falls back to the default of 20.
RecruitmentShiftMultiplier=20

; ── Presets ──────────────────────────────────────────────────────────────────
; Named threshold sets loadable from the editor's preset picklist (PageUp/
; PageDown to choose a name, Enter or the Apply button to load it). Applying a
; preset is replace-all: goods not listed are cleared to 0. Each line is
;   Good = min:X, max:Y   (either part optional); good names match the editor.
; Add, edit or remove [preset:NAME] sections freely; NAME is shown in the list.

[preset:Fast Estate]
Apples=max:5
Bread=min:2
Meat=min:2
Cheese=min:2
